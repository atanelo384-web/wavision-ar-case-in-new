<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wavision AR - Настоящая дополненная реальность</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #000;
        }

        /* Контейнер для AR сцены */
        #ar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Видео с камеры (фон AR) */
        #ar-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отображение для естественного вида */
            z-index: 1;
        }

        /* Canvas для 3D объектов (Three.js) */
        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
        }

        /* Полупрозрачные окна интерфейса (поверх AR) */
        .ar-interface {
            position: absolute;
            z-index: 10;
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(20, 30, 55, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            color: white;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        /* Окна приложений (перетаскиваемые) */
        .draggable-ar-window {
            position: absolute;
            background: rgba(15, 25, 45, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            min-width: 240px;
            min-height: 180px;
            cursor: grab;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: box-shadow 0.1s;
        }
        .draggable-ar-window:active { cursor: grabbing; }
        .window-header {
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 24px 24px 0 0;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .window-content { padding: 16px; font-size: 0.9rem; }
        .close-window {
            background: rgba(255,80,80,0.7);
            border: none;
            color: white;
            border-radius: 20px;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Точка прицела (управление взглядом) */
        .gaze-dot {
            position: fixed;
            width: 14px;
            height: 14px;
            background: rgba(0, 255, 255, 0.95);
            border-radius: 50%;
            box-shadow: 0 0 15px cyan, 0 0 5px rgba(0,255,255,0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.05s ease;
        }
        .gaze-dot::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 255, 255, 0.7);
            transform: translate(-50%, -50%);
        }

        /* Прогресс-бар для клика взглядом (1.5 сек) */
        .progress-ring {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10001;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-ring svg { transform: rotate(-90deg); }
        .progress-ring circle {
            fill: none;
            stroke: #0ff;
            stroke-width: 3;
            stroke-dasharray: 126;
            stroke-dashoffset: 126;
        }
        .hidden { display: none; }

        /* Клавиатура AR */
        .ar-keyboard {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 90%;
            z-index: 200;
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto;
        }
        .ar-key {
            background: rgba(255,255,255,0.2);
            padding: 10px 16px;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            min-width: 50px;
            text-align: center;
            color: white;
        }
        .ar-key:active { background: cyan; color: black; transform: scale(0.96); }

        /* Стартовое окно приветствия */
        .welcome-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        button {
            background: rgba(0, 200, 255, 0.7);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover { background: rgba(0, 200, 255, 1); transform: scale(1.02); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="ar-container">
    <video id="ar-video" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
</div>

<!-- Интерфейсные элементы -->
<div id="interface-root"></div>
<div class="gaze-dot" id="gazeDot"></div>
<div class="progress-ring hidden" id="progressRing">
    <svg width="46" height="46">
        <circle cx="23" cy="23" r="20" stroke="cyan" stroke-width="2" fill="none"/>
        <circle id="progressCircle" cx="23" cy="23" r="20" stroke="cyan" stroke-width="3" fill="none" stroke-dasharray="125.66" stroke-dashoffset="125.66"/>
    </svg>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // ---------- ИНИЦИАЛИЗАЦИЯ НАСТОЯЩЕЙ AR С КАМЕРОЙ ----------
    const video = document.getElementById('ar-video');
    const canvas = document.getElementById('ar-canvas');
    let scene, camera, renderer;
    let arObjects = []; // 3D объекты в AR пространстве
    
    // Запрос доступа к камере
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            await video.play();
            return true;
        } catch (err) {
            console.warn("Камера не доступна, используем fallback фон");
            // Fallback: имитация AR без камеры (чёрный фон с текстурой)
            const fakeCanvas = document.createElement('canvas');
            const ctx = fakeCanvas.getContext('2d');
            fakeCanvas.width = 640;
            fakeCanvas.height = 480;
            ctx.fillStyle = '#0a0f2a';
            ctx.fillRect(0,0,640,480);
            ctx.fillStyle = 'cyan';
            ctx.font = '20px Arial';
            ctx.fillText('AR режим (камера недоступна)', 150, 240);
            const fakeStream = fakeCanvas.captureStream();
            video.srcObject = fakeStream;
            await video.play();
            return false;
        }
    }

    // Инициализация Three.js поверх видео
    function initThreeAR() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        scene = new THREE.Scene();
        scene.background = null; // прозрачный, чтобы видео было фоном
        
        // Камера Three.js с перспективой
        camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(width, height);
        renderer.setClearColor(0x000000, 0); // полностью прозрачный фон
        
        // Освещение для 3D объектов
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466ff, 0.5);
        backLight.position.set(0, 1, -2);
        scene.add(backLight);
        
        // Добавляем парящие AR объекты (куб, сфера, тор)
        const geometryBox = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const materialBox = new THREE.MeshStandardMaterial({ color: 0x33aaff, metalness: 0.7, roughness: 0.2, emissive: 0x004466 });
        const cube = new THREE.Mesh(geometryBox, materialBox);
        cube.position.set(-1.2, 0.2, -1);
        scene.add(cube);
        arObjects.push(cube);
        
        const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0x331133, metalness: 0.4 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(1.3, -0.3, -0.8);
        scene.add(sphere);
        arObjects.push(sphere);
        
        const torusGeo = new THREE.TorusGeometry(0.6, 0.15, 32, 100);
        const torusMat = new THREE.MeshStandardMaterial({ color: 0x44ffaa, emissive: 0x226644 });
        const torus = new THREE.Mesh(torusGeo, torusMat);
        torus.position.set(0, 1.1, -1.2);
        scene.add(torus);
        arObjects.push(torus);
        
        // Плавающие частицы вокруг
        const particleCount = 300;
        const particlesGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 8;
            positions[i*3+1] = (Math.random() - 0.5) * 5;
            positions[i*3+2] = (Math.random() - 0.5) * 4 - 2;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.03, transparent: true, opacity: 0.6 });
        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);
        arObjects.push(particleSystem);
        
        animate();
    }
    
    function animate() {
        requestAnimationFrame(animate);
        // Анимация объектов: вращение и плавание
        arObjects.forEach(obj => {
            if (obj.isMesh && obj.geometry.type === 'BoxGeometry') {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.015;
            }
            if (obj.isMesh && obj.geometry.type === 'SphereGeometry') {
                obj.position.y = -0.3 + Math.sin(Date.now() * 0.002) * 0.1;
            }
            if (obj.isMesh && obj.geometry.type === 'TorusGeometry') {
                obj.rotation.x += 0.02;
                obj.rotation.z += 0.01;
            }
            if (obj.isPoints) {
                obj.rotation.y += 0.002;
                obj.rotation.x += 0.001;
            }
        });
        renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    });
    
    // ---------- УПРАВЛЕНИЕ ТОЧКОЙ И КЛИК ВЗГЛЯДОМ (1.5 сек) ----------
    let currentFocusElement = null;
    let hoverActive = false;
    let progressInterval = null;
    const gazeDot = document.getElementById('gazeDot');
    const progressRingDiv = document.getElementById('progressRing');
    const progressCircle = document.getElementById('progressCircle');
    let gazeX = window.innerWidth/2, gazeY = window.innerHeight/2;
    
    function updateGazeDot(e) {
        if (e.clientX) { gazeX = e.clientX; gazeY = e.clientY; }
        else if (e.touches && e.touches[0]) { gazeX = e.touches[0].clientX; gazeY = e.touches[0].clientY; }
        gazeDot.style.left = gazeX + 'px';
        gazeDot.style.top = gazeY + 'px';
        progressRingDiv.style.left = gazeX + 'px';
        progressRingDiv.style.top = gazeY + 'px';
        
        const elemUnderCursor = document.elementsFromPoint(gazeX, gazeY)[0];
        let clickable = null;
        let el = elemUnderCursor;
        while(el && el !== document.body) {
            if(el.tagName === 'BUTTON' || el.classList?.contains('ar-key') || el.classList?.contains('close-window') || el.getAttribute('data-click') === 'true') {
                clickable = el;
                break;
            }
            el = el.parentElement;
        }
        if(clickable !== currentFocusElement) {
            resetHover();
            currentFocusElement = clickable;
            if(clickable) startHover(clickable);
            else progressRingDiv.classList.add('hidden');
        }
    }
    
    function startHover(target) {
        if (hoverActive) return;
        hoverActive = true;
        progressRingDiv.classList.remove('hidden');
        const perimeter = 2 * Math.PI * 20; // ~125.66
        progressCircle.style.strokeDasharray = perimeter;
        progressCircle.style.strokeDashoffset = perimeter;
        const startTime = Date.now();
        const duration = 1500;
        
        function updateProgress() {
            const elapsed = Date.now() - startTime;
            let progress = Math.min(1, elapsed / duration);
            const offset = perimeter * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;
            if (progress >= 1) {
                if (currentFocusElement && document.body.contains(currentFocusElement)) {
                    currentFocusElement.click();
                    if (navigator.vibrate) navigator.vibrate(50);
                }
                resetHover();
            } else {
                requestAnimationFrame(updateProgress);
            }
        }
        requestAnimationFrame(updateProgress);
        window._hoverTimeout = setTimeout(() => {}, duration);
    }
    
    function resetHover() {
        hoverActive = false;
        progressRingDiv.classList.add('hidden');
        if (window._hoverTimeout) clearTimeout(window._hoverTimeout);
        currentFocusElement = null;
    }
    
    // Отслеживание мыши и тач
    window.addEventListener('mousemove', updateGazeDot);
    window.addEventListener('touchmove', (e) => { if(e.touches[0]) updateGazeDot(e.touches[0]); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchstart', (e) => { if(e.touches[0]) updateGazeDot(e.touches[0]); });
    
    // ---------- ПОЛЬЗОВАТЕЛЬСКИЙ ИНТЕРФЕЙС (ОКНА, ПРИЛОЖЕНИЯ, КЛАВИАТУРА) ----------
    const interfaceRoot = document.getElementById('interface-root');
    
    function showWelcomeAR() {
        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'welcome-screen';
        welcomeDiv.innerHTML = `
            <div class="glass-panel">
                <h1 style="font-size: 2.5rem; margin-bottom: 10px;">✨ WAVISION AR ✨</h1>
                <p style="font-size: 1rem; margin-bottom: 20px;">Настоящая дополненная реальность с камерой</p>
                <div style="display: flex; gap: 12px; justify-content: center; margin: 20px 0;">
                    <span>🇷🇺 Привет</span> <span>🇬🇧 Hello</span> <span>🇫🇷 Bonjour</span> <span>🇪🇸 Hola</span> <span>🇯🇵 こんにちは</span>
                </div>
                <button id="startARBtn" data-click="true">✨ Начать сеанс AR ✨</button>
            </div>
        `;
        interfaceRoot.appendChild(welcomeDiv);
        document.getElementById('startARBtn')?.addEventListener('click', () => {
            welcomeDiv.remove();
            showSetupAR();
        });
    }
    
    function showSetupAR() {
        const setupDiv = document.createElement('div');
        setupDiv.className = 'welcome-screen';
        setupDiv.innerHTML = `
            <div class="glass-panel">
                <h2>🔧 Настройка AR пространства</h2>
                <div style="margin: 20px 0; text-align: left;">
                    <label>🔘 Размер точки прицела</label>
                    <input type="range" id="dotSizeRange" min="8" max="24" value="14" style="width:100%; margin: 8px 0;">
                    <label>🌈 Яркость 3D объектов</label>
                    <input type="range" id="brightnessRange" min="0.3" max="1.5" step="0.01" value="1" style="width:100%;">
                </div>
                <button id="finishSetupBtn" data-click="true">🚀 Запустить Wavision OS</button>
            </div>
        `;
        interfaceRoot.appendChild(setupDiv);
        
        document.getElementById('dotSizeRange')?.addEventListener('input', (e) => {
            const size = e.target.value;
            gazeDot.style.width = size + 'px';
            gazeDot.style.height = size + 'px';
        });
        document.getElementById('brightnessRange')?.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            scene.traverse(obj => { if(obj.isMesh && obj.material) obj.material.emissiveIntensity = val * 0.5; });
        });
        document.getElementById('finishSetupBtn')?.addEventListener('click', () => {
            setupDiv.remove();
            launchDesktopAR();
        });
    }
    
    function launchDesktopAR() {
        // Создаем перетаскиваемые AR-окна
        const windowsData = [
            { title: "📱 AR Настройки", content: "Управление жестами: точка + ожидание 1.5с. Можно перетаскивать окна.", x: 80, y: 100, w: 260 },
            { title: "🌍 AR Браузер", content: "Иммерсивный интернет в дополненной реальности.", x: 400, y: 80, w: 260 },
            { title: "🎨 3D Галлерея", content: "Парящие объекты вокруг вас. Наслаждайтесь AR эффектом!", x: 150, y: 350, w: 280 },
            { title: "📊 Система", content: "FPS: отлично, Камера активна, 3D объекты стабильны.", x: 550, y: 300, w: 270 }
        ];
        
        windowsData.forEach(win => {
            createDraggableWindow(win.title, win.content, win.x, win.y, win.w);
        });
        
        // Виртуальная клавиатура AR
        const keyboardDiv = document.createElement('div');
        keyboardDiv.className = 'ar-keyboard';
        const keys = ['1','2','3','4','5','6','7','8','9','0','Q','W','E','R','T','Y','U','I','O','P','A','S','D','F','G','H','J','K','L','Z','X','C','V','B','N','M','⌫','⏎','Space'];
        keys.forEach(k => {
            const keyEl = document.createElement('div');
            keyEl.className = 'ar-key';
            keyEl.innerText = k;
            keyEl.setAttribute('data-click', 'true');
            keyEl.addEventListener('click', (e) => {
                e.stopPropagation();
                const msg = document.createElement('div');
                msg.className = 'glass-panel';
                msg.style.position = 'fixed';
                msg.style.bottom = '100px';
                msg.style.left = '50%';
                msg.style.transform = 'translateX(-50%)';
                msg.style.padding = '8px 16px';
                msg.style.fontSize = '14px';
                msg.style.zIndex = '10000';
                msg.innerText = `AR клавиша: ${k}`;
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 800);
            });
            keyboardDiv.appendChild(keyEl);
        });
        document.body.appendChild(keyboardDiv);
        
        // Добавляем информационный баннер AR
        const arInfo = document.createElement('div');
        arInfo.className = 'glass-panel';
        arInfo.style.position = 'fixed';
        arInfo.style.top = '20px';
        arInfo.style.right = '20px';
        arInfo.style.padding = '8px 16px';
        arInfo.style.fontSize = '12px';
        arInfo.style.zIndex = '100';
        arInfo.innerHTML = '🔴 AR ACTIVE | Управление взглядом';
        document.body.appendChild(arInfo);
    }
    
    function createDraggableWindow(title, content, left, top, width) {
        const winDiv = document.createElement('div');
        winDiv.className = 'draggable-ar-window';
        winDiv.style.left = left + 'px';
        winDiv.style.top = top + 'px';
        winDiv.style.width = width + 'px';
        winDiv.innerHTML = `
            <div class="window-header">${title}<button class="close-window" data-click="true">✕</button></div>
            <div class="window-content">${content}<br><br><small>✨ Перетащи меня ✨</small></div>
        `;
        document.body.appendChild(winDiv);
        
        // Перетаскивание
        const header = winDiv.querySelector('.window-header');
        let isDragging = false, offsetX, offsetY;
        header.style.cursor = 'grab';
        const onMouseMove = (e) => {
            if (!isDragging) return;
            let clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
            winDiv.style.left = (clientX - offsetX) + 'px';
            winDiv.style.top = (clientY - offsetY) + 'px';
        };
        const onMouseUp = () => {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.removeEventListener('touchmove', onMouseMove);
            document.removeEventListener('touchend', onMouseUp);
        };
        const onMouseDown = (e) => {
            e.preventDefault();
            let clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
            const rect = winDiv.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            isDragging = true;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('touchmove', onMouseMove, { passive: false });
            document.addEventListener('touchend', onMouseUp);
        };
        header.addEventListener('mousedown', onMouseDown);
        header.addEventListener('touchstart', onMouseDown, { passive: false });
        
        const closeBtn = winDiv.querySelector('.close-window');
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            winDiv.remove();
        });
    }
    
    // Глобальная инициализация: камера -> Three AR -> интерфейс
    async function initFullAR() {
        await initCamera();
        initThreeAR();
        showWelcomeAR();
        // Небольшая инструкция по управлению
        setTimeout(() => {
            const tip = document.createElement('div');
            tip.className = 'glass-panel';
            tip.style.position = 'fixed';
            tip.style.bottom = '30px';
            tip.style.left = '20px';
            tip.style.padding = '10px 18px';
            tip.style.fontSize = '12px';
            tip.style.zIndex = '10000';
            tip.innerHTML = '🎯 Управление точкой: двигайте мышь/палец. Задержите на элементе 1.5 сек для клика.';
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 6000);
        }, 1000);
    }
    
    initFullAR();
</script>
